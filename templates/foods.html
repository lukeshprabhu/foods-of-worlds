{% extends "base.html" %}{% block content %}<h2>{% if search_query %}Search: {{search_query}}{% else %}Our Menu{% endif %}</h2><div class="grid">{% for f in foods %}<div class="card"><h3>{{f.name}}</h3><p class="muted">{{f.category}}</p><p>{{f.description}}</p><p class="price">₹{{'%.2f'|format(f.price)}}</p><button class="btn" onclick='addToCart({{f.id}},{{f.name|tojson}},{{f.price}})'>Add to Cart</button></div>{% else %}<p>No food found.</p>{% endfor %}</div>{% endblock %}
