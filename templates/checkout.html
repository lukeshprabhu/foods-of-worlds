{% extends "base.html" %}{% block content %}<form class="form" onsubmit="event.preventDefault();placeOrder()"><h2>Checkout</h2><label>Delivery Address</label><textarea id="address" required>{% if addresses %}{{addresses[0].address}}{% endif %}</textarea><button type="button" class="btn secondary" onclick="saveLocation()">📍 Use/Save Location</button><label>Phone</label><input id="phone" required value="{{addresses[0].phone if addresses else ''}}"><label>Payment</label><select id="payment"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select><label>Coupon</label><input id="coupon" placeholder="Enter coupon code"><br><br><button class="btn">Place Order</button></form>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/checkout.js')}}"></script>{% endblock %}
