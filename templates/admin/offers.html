{% extends "admin/base.html" %}{% block content %}<h2>Offers & Coupons</h2><form class="form" method="post"><input name="title" placeholder="Offer title" required><input name="coupon_code" placeholder="Coupon code" required><textarea name="description" placeholder="Description"></textarea><select name="discount_type"><option value="percent">Percent</option><option value="fixed">Fixed</option></select><input name="discount_value" type="number" step=".01" placeholder="Discount" required><input name="min_order" type="number" step=".01" placeholder="Minimum order"><label>Valid From</label><input name="valid_from" type="datetime-local" required><label>Valid Until</label><input name="valid_until" type="datetime-local" required><br><button class="btn">Create Offer</button></form><table class="table"><tr><th>Title</th><th>Coupon</th><th>Discount</th><th>Validity</th></tr>{% for o in offers %}<tr><td>{{o.title}}</td><td>{{o.coupon_code}}</td><td>{{o.discount_value}} {{o.discount_type}}</td><td>{{o.valid_from}} → {{o.valid_until}}</td></tr>{% endfor %}</table>{% endblock %}
