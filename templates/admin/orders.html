{% extends "admin/base.html" %}{% block content %}<h2>Order Management</h2><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Update</th></tr>{% for o in orders %}<tr><td>{{o.order_number}}<br>{{o.created_at}}</td><td>{{o.customer}}<br>{{o.email}}</td><td>₹{{o.total_amount}}</td><td>{{o.order_status}}</td><td><form method="post" action="/admin/order-status/{{o.id}}"><select name="status"><option>Pending</option><option>Confirmed</option><option>Preparing</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select><button class="btn">Update</button></form></td></tr>{% endfor %}</table>{% endblock %}
