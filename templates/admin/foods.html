{% extends "admin/base.html" %}{% block content %}<h2>Food Management</h2><form class="form" method="post" action="/admin/food/add"><h3>Add Food</h3><input name="name" placeholder="Food name" required><br><br><select name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><br><br><input name="price" type="number" step=".01" placeholder="Price" required><br><br><textarea name="description" placeholder="Description"></textarea><br><br><label><input type="checkbox" name="is_available" checked> Available</label><br><br><button class="btn">Add Food</button></form><table class="table"><tr><th>Name</th><th>Category</th><th>Price</th><th>Action</th></tr>{% for f in foods %}<tr><td>{{f.name}}</td><td>{{f.category}}</td><td>₹{{f.price}}</td><td><form method="post" action="/admin/food/delete/{{f.id}}"><button class="btn">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
