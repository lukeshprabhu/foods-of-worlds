{% extends "admin/base.html" %}{% block content %}<h2>Employee Management</h2><a class="btn" href="/admin/employee/add">+ Add Employee</a><br><br><table class="table"><tr><th>No.</th><th>Name</th><th>Designation</th><th>Nationality</th><th>Status</th><th>Documents</th><th>Delete</th></tr>{% for e in employees %}<tr><td>{{e.employee_number}}</td><td>{{e.full_name}}</td><td>{{e.designation}}</td><td>{{e.nationality}}</td><td>{{e.employment_status}}</td><td><a class="btn" href="/admin/employee/{{e.id}}/documents">Documents</a></td><td><form method="post" action="/admin/employee/delete/{{e.id}}"><button class="btn">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
